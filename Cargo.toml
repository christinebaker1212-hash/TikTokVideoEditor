[package]
name = "combo-editor"
version = "1.1.0"
edition = "2021"
description = "Automatic TikTok editor for fighting-game combo clips"
license = "MIT"
default-run = "combo-editor"

[[bin]]
name = "combo-editor"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "wgpu", "x11", "wayland"] }
egui = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustfft = "6"
rayon = "1"
cpal = "0.18"
rfd = "0.17"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[build-dependencies]
# Only used when the target is Windows (checked in build.rs).
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
strip = true

# Image processing is far too slow unoptimised; keep dev builds usable.
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
