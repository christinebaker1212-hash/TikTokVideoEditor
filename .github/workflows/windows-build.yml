name: Windows portable build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach the zip to releases on version tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build portable app
        shell: pwsh
        run: ./packaging/build_windows.ps1

      - name: Unit tests on Windows
        shell: pwsh
        run: |
          $env:PATH = "$PWD\dist\ComboEditor\ffmpeg;$env:PATH"
          python -m pip install -r requirements-dev.txt
          python -m pytest -q

      - name: Smoke test the packaged .exe
        run: python packaging/smoke_test.py dist/ComboEditor

      - uses: actions/upload-artifact@v4
        with:
          name: ComboEditor-win64
          path: dist/ComboEditor/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ComboEditor-win64.zip
